<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Balistidae Quest">
<meta name="theme-color" content="#12b5e5">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="icon" href="assets/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Balistidae Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --sky:#8ee6ff; --sky2:#d6f7ff;
  --sea:#12b5e5; --sea2:#0a78c2; --deep:#07457e;
  --sand:#ffe39a; --sand2:#f5c65b;
  --sun:#ffd21f; --coral:#ff6b6b; --pink:#ff8fc7; --leaf:#2ec46d; --leaf2:#1a9b52;
  --orange:#ff9f1c; --purple:#8e6bff;
  --ink:#16324f; --card:#ffffff; --card2:#fff8e3;
  --bg:#bdf0ff; --shadow:rgba(10,40,80,.28);
  --r:26px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#0d3b63; --sky:#1d5f94; --sky2:#2a78b0; }
}
:root[data-theme="dark"]{ --bg:#0d3b63; --sky:#1d5f94; --sky2:#2a78b0; }

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; height:100%; overflow:hidden; overscroll-behavior:none;}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Fredoka", ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", system-ui, sans-serif;
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
  touch-action:manipulation;
}
input{ -webkit-user-select:text; user-select:text; font-family:inherit; }
button{font-family:inherit; color:inherit;}

#app{position:fixed; inset:0; display:flex; flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);}
#bar{height:64px; flex:none; display:flex; align-items:center; gap:10px; padding:0 14px;
  background:linear-gradient(180deg,#19c2f0,#0b93d6); color:#fff; box-shadow:0 4px 0 rgba(0,0,0,.15); z-index:5;}
#bar .ttl{flex:1; font-weight:700; font-size:clamp(17px,2.6vw,26px); text-shadow:0 2px 0 rgba(0,0,0,.25); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.ibtn{width:48px; height:48px; border-radius:16px; border:0; font-size:24px; background:rgba(255,255,255,.22); color:#fff; cursor:pointer; flex:none;}
.ibtn:active{transform:scale(.92);}
.ibtn.off{opacity:.45;}
#shells{background:#fff; color:var(--ink); border-radius:20px; padding:6px 14px; font-weight:700; font-size:20px; box-shadow:0 3px 0 rgba(0,0,0,.18); flex:none;}
#shells.pop{animation:pop .5s;}
#stage{position:relative; flex:1; overflow:hidden;}

/* ---------- common ---------- */
.full{position:absolute; inset:0;}
.center{display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;}
.btn{border:0; border-radius:22px; padding:14px 26px; font-size:clamp(18px,2.4vw,24px); font-weight:700; cursor:pointer;
  background:var(--sun); color:var(--ink); box-shadow:0 6px 0 #d9a300, 0 10px 18px var(--shadow); transition:transform .08s;}
.btn:active{transform:translateY(4px); box-shadow:0 2px 0 #d9a300;}
.btn.blue{background:#35c3ff; color:#fff; box-shadow:0 6px 0 #1283c4, 0 10px 18px var(--shadow);}
.btn.green{background:var(--leaf); color:#fff; box-shadow:0 6px 0 var(--leaf2), 0 10px 18px var(--shadow);}
.btn.coral{background:var(--coral); color:#fff; box-shadow:0 6px 0 #c94444, 0 10px 18px var(--shadow);}
.btn.small{font-size:16px; padding:10px 16px;}
.btn:disabled{opacity:.45;}
.panel{background:var(--card); border:4px solid var(--ink); border-radius:var(--r); box-shadow:0 10px 0 rgba(22,50,79,.25); padding:22px;}
.overlay{position:absolute; inset:0; background:rgba(8,40,70,.45); display:flex; align-items:center; justify-content:center; padding:16px; z-index:20; animation:fade .25s;}
.toast{position:absolute; left:50%; top:14px; transform:translateX(-50%); background:#fff; border:3px solid var(--ink); border-radius:18px; padding:10px 18px; font-size:clamp(15px,2vw,20px); font-weight:600; z-index:30; max-width:92%; box-shadow:0 6px 0 rgba(0,0,0,.15); animation:drop .35s;}
.shake{animation:shake .45s;}
.pop-in{animation:popin .35s cubic-bezier(.2,1.6,.4,1);}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
@keyframes popin{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes drop{from{transform:translate(-50%,-30px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-14px)}40%{transform:translateX(12px)}60%{transform:translateX(-8px)}80%{transform:translateX(5px)}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-10px) rotate(2deg)}}
@keyframes swim{0%,100%{transform:translateX(0)}50%{transform:translateX(12px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
@keyframes wave{from{background-position-x:0}to{background-position-x:200px}}
@keyframes spin{to{transform:rotate(360deg)}}
.bob{animation:bob 3s ease-in-out infinite;}
.pulse{animation:pulse 1s ease-in-out infinite;}

/* sea background with waves */
.seabg{background:linear-gradient(180deg,var(--sky) 0%,var(--sky2) 30%,var(--sea) 30%,var(--sea2) 100%);}
.waves{position:absolute; left:0; right:0; height:40px;
  background:radial-gradient(circle at 25px -8px, transparent 26px, rgba(255,255,255,.55) 27px, transparent 31px) 0 0/50px 40px repeat-x;
  animation:wave 6s linear infinite;}

/* ---------- title ---------- */
.title-scene{background:linear-gradient(180deg,#7fe0ff 0%,#c9f5ff 45%,#19b8e8 45%,#0a78c2 100%); overflow:hidden;}
.sunball{position:absolute; right:7%; top:6%; width:120px; height:120px; border-radius:50%; background:radial-gradient(circle,#fff6a8,#ffd21f 60%,#ffb300); box-shadow:0 0 60px #ffe45c;}
.logo-wrap{position:relative; z-index:2; display:flex; flex-direction:column; align-items:center; gap:6px;}
.logo-img{max-width:min(420px,70vw); max-height:24vh; filter:drop-shadow(0 6px 0 rgba(0,0,0,.18)); background:#fff; border-radius:24px; padding:10px 18px; border:4px solid var(--ink);}
.big-title{font-size:clamp(40px,8vw,88px); font-weight:700; line-height:.95; color:#fff; margin:0;
  text-shadow:0 5px 0 var(--ink), 0 -3px 0 var(--ink), 3px 0 0 var(--ink), -3px 0 0 var(--ink), 0 12px 20px rgba(0,0,0,.25);}
.sub-title{font-size:clamp(18px,3vw,30px); font-weight:600; color:var(--ink); background:var(--sun); padding:6px 18px; border-radius:18px; border:3px solid var(--ink); transform:rotate(-2deg);}
.title-fish{position:absolute; width:clamp(120px,20vw,220px);}
.row{display:flex; gap:16px; flex-wrap:wrap; justify-content:center;}

/* ---------- talk / story ---------- */
.talk{display:flex; align-items:flex-end; gap:14px; width:min(860px,100%);}
.talker{width:clamp(110px,18vw,180px); flex:none; animation:bob 3s ease-in-out infinite;}
.talker svg{width:100%; height:auto; display:block;}
.bubble{position:relative; flex:1; background:#fff; border:4px solid var(--ink); border-radius:28px; padding:20px 22px 18px; font-size:clamp(19px,2.5vw,27px); line-height:1.35; box-shadow:0 8px 0 rgba(22,50,79,.25); animation:popin .3s;}
.bubble:before{content:""; position:absolute; left:-22px; bottom:30px; border:12px solid transparent; border-right:14px solid var(--ink);}
.bubble .who{font-size:.7em; font-weight:700; color:var(--sea2); text-transform:uppercase; letter-spacing:.05em; margin-bottom:4px;}
.bubble .actions{display:flex; justify-content:flex-end; margin-top:14px;}
.photo{display:block; margin:0 auto 12px; max-width:100%; max-height:28vh; border:8px solid #fff; border-bottom-width:26px; box-shadow:0 8px 18px rgba(0,0,0,.3); transform:rotate(-2deg); border-radius:4px;}
b.hl{color:var(--coral);}

/* ---------- quiz ---------- */
.quiz{width:min(640px,100%); max-height:100%; overflow:auto; text-align:center;}
.qtag{display:inline-block; background:var(--purple); color:#fff; font-weight:700; border-radius:14px; padding:4px 14px; font-size:16px;}
.qtext{font-size:clamp(20px,2.8vw,28px); margin:12px 0; line-height:1.3;}
.qtext ul{text-align:left; margin:8px auto; padding-left:26px; max-width:520px;}
.qhint{min-height:28px; color:#c94444; font-weight:600; font-size:clamp(16px,2vw,20px);}
.qart{font-size:56px; line-height:1;}
.qart svg{max-height:110px; width:auto;}
.opts{display:grid; gap:14px; margin-top:8px;}
.opt{background:#e9f8ff; color:var(--ink); box-shadow:0 6px 0 #9fd3ea; border:3px solid var(--ink);}
.opt.right{background:var(--leaf); color:#fff;}
.opt.wrong{background:#ffd0d0; text-decoration:line-through;}
.display{font-size:44px; font-weight:700; background:var(--card2); border:4px solid var(--ink); border-radius:18px; min-height:70px; display:flex; align-items:center; justify-content:center; gap:8px; margin:8px auto; max-width:320px;}
.display .unit{font-size:22px; opacity:.7;}
.pad{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; max-width:320px; margin:10px auto 0;}
.key{height:62px; border-radius:18px; border:3px solid var(--ink); background:#fff; font-size:28px; font-weight:700; box-shadow:0 5px 0 #c5d6e3; cursor:pointer;}
.key:active{transform:translateY(3px); box-shadow:0 2px 0 #c5d6e3;}
.key.ok{background:var(--leaf); color:#fff;}
.yay{font-size:clamp(34px,5vw,54px); font-weight:700; color:var(--leaf2);}
.pts{font-size:26px; font-weight:700; margin:4px 0 10px;}
.fact{background:#fff6cf; border:3px dashed var(--orange); border-radius:18px; padding:12px 16px; font-size:clamp(17px,2.2vw,22px); line-height:1.35; margin:8px 0 18px; text-align:left;}

/* ---------- journey map ---------- */
.journey{background:linear-gradient(180deg,#7fe0ff,#1fb8e8 60%,#0b86cc);}
.jnode{position:absolute; transform:translate(-50%,-50%); display:flex; flex-direction:column; align-items:center; gap:4px; border:0; background:none; cursor:pointer; padding:0;}
.jnode .disc{width:clamp(76px,11vw,112px); height:clamp(76px,11vw,112px); border-radius:50%; background:#fff; border:5px solid var(--ink); display:flex; align-items:center; justify-content:center; font-size:clamp(36px,5.6vw,58px); box-shadow:0 7px 0 rgba(0,0,0,.2); position:relative;}
.jnode .lbl{background:var(--ink); color:#fff; font-weight:600; border-radius:12px; padding:4px 10px; font-size:clamp(13px,1.7vw,18px); white-space:nowrap;}
.jnode.locked .disc{filter:grayscale(1); opacity:.6;}
.jnode.next .disc{animation:pulse 1.2s infinite; background:var(--sun);}
.jnode .tick{position:absolute; right:-8px; top:-8px; width:36px; height:36px; border-radius:50%; background:var(--leaf); color:#fff; font-size:22px; display:flex; align-items:center; justify-content:center; border:3px solid #fff;}
.jnode .num{position:absolute; left:-8px; top:-8px; width:32px; height:32px; border-radius:50%; background:var(--coral); color:#fff; font-size:18px; font-weight:700; display:flex; align-items:center; justify-content:center; border:3px solid #fff;}

/* ---------- map chapters ---------- */
.mapwrap{position:absolute; inset:0; display:flex; gap:14px; padding:14px; align-items:stretch;}
.mapbox{flex:1.25; min-width:0; min-height:0; background:#fff; border:4px solid var(--ink); border-radius:var(--r); overflow:hidden; display:flex;}
.mapbox svg{width:100%; height:100%; display:block;}
.side{flex:1; min-width:0; display:flex; flex-direction:column; gap:14px; justify-content:center;}
.side .panel{font-size:clamp(17px,2.2vw,23px); line-height:1.35;}
.odo{display:inline-flex; gap:3px; background:#111; padding:5px 7px; border-radius:10px;}
.odo span{background:#333; color:#fff; font-family:ui-monospace,Menlo,monospace; font-size:22px; padding:2px 5px; border-radius:4px;}
@media (orientation:portrait){
  .mapwrap{flex-direction:column;}
  .mapbox{flex:1.4;}
  .side{flex:none;}
}
.stamp{width:min(360px,80vw); aspect-ratio:1; border-radius:50%; border:10px double var(--coral); color:var(--coral); display:flex; flex-direction:column; align-items:center; justify-content:center; transform:rotate(-12deg); background:rgba(255,255,255,.95); animation:stampin .5s cubic-bezier(.2,1.6,.4,1); text-align:center; padding:20px;}
.stamp .ic{font-size:80px;}
.stamp .t{font-size:30px; font-weight:700; line-height:1.05;}
@keyframes stampin{from{transform:rotate(-12deg) scale(2.5); opacity:0}to{transform:rotate(-12deg) scale(1); opacity:1}}

/* ---------- memory ---------- */
.mem-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:clamp(8px,1.5vw,16px); width:min(760px,94vw); max-height:72%; aspect-ratio:4/3.1;}
@media (orientation:portrait){ .mem-grid{grid-template-columns:repeat(3,1fr); aspect-ratio:3/4.2; width:min(560px,90vw);} }
.card{position:relative; perspective:600px; cursor:pointer; border:0; background:none; padding:0;}
.card .in{position:absolute; inset:0; transition:transform .45s; transform-style:preserve-3d;}
.card.flip .in{transform:rotateY(180deg);}
.card .f,.card .b{position:absolute; inset:0; border-radius:18px; border:4px solid var(--ink); backface-visibility:hidden; -webkit-backface-visibility:hidden; display:flex; align-items:center; justify-content:center;}
.card .f{background:repeating-linear-gradient(45deg,#19b8e8 0 14px,#35c9f5 14px 28px); font-size:clamp(28px,4vw,44px);}
.card .b{background:#fff; transform:rotateY(180deg); font-size:clamp(40px,7vw,70px);}
.card.done .b{background:#d9ffe7;}

/* ---------- boat / buoys ---------- */
.buoy{cursor:pointer;}
.buoy text{font-family:inherit; font-weight:700;}

/* ---------- fishing ---------- */
.fishing{background:linear-gradient(180deg,#86e1ff 0%,#c8f4ff 22%,#1fb3e6 22%,#0a6db3 60%,#063f75 100%); overflow:hidden;}
.fishing .boat{position:absolute; left:8%; top:calc(22% - 70px); width:clamp(160px,24vw,260px);}
.fishing .fish{position:absolute; width:clamp(130px,20vw,230px); transition:left .2s, top .2s;}
.fishing svg.line{position:absolute; inset:0; width:100%; height:100%; pointer-events:none;}
.tmeter{position:absolute; right:3%; top:26%; bottom:22%; width:44px; border:4px solid var(--ink); border-radius:24px; overflow:hidden;
  background:linear-gradient(0deg,#9fe7ff 0%,#9fe7ff 25%,#4fe08a 25%,#4fe08a 75%,#ffd21f 75%,#ffd21f 90%,#ff5252 90%);}
.tmeter .nd{position:absolute; left:-4px; right:-4px; height:8px; background:var(--ink); border-radius:4px;}
.tlabel{position:absolute; right:3%; top:calc(26% - 34px); width:90px; margin-right:-23px; text-align:center; font-weight:700; color:#fff; text-shadow:0 2px 0 var(--ink);}
.pbar{position:absolute; left:4%; right:calc(3% + 70px); bottom:4%; height:30px; background:#fff; border:4px solid var(--ink); border-radius:16px; overflow:hidden;}
.pbar .fill{height:100%; width:0; background:linear-gradient(90deg,var(--orange),var(--sun));}
.pbar .lb{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:16px;}
.reel{position:absolute; right:calc(3% + 64px); bottom:calc(4% + 44px); width:clamp(140px,20vw,190px); height:clamp(140px,20vw,190px); border-radius:50%; font-size:clamp(20px,2.6vw,26px);}
.hint-top{position:absolute; left:50%; transform:translateX(-50%); top:calc(22% + 12px); background:rgba(255,255,255,.92); border:3px solid var(--ink); border-radius:18px; padding:8px 16px; font-weight:600; font-size:clamp(15px,2vw,20px); text-align:center; width:max-content; max-width:70%;}
.gate-meter{position:absolute; left:10%; right:10%; bottom:18%; height:48px; background:#ff8a8a; border:4px solid var(--ink); border-radius:24px; overflow:hidden;}
.gate-meter .zone{position:absolute; top:0; bottom:0; background:#4fe08a;}
.gate-meter .needle{position:absolute; top:-4px; bottom:-4px; width:10px; margin-left:-5px; background:var(--ink); border-radius:5px;}
.rock{position:absolute; font-size:clamp(50px,8vw,90px);}
.gdots{position:absolute; left:50%; bottom:calc(18% + 60px); transform:translateX(-50%); font-size:34px; letter-spacing:8px;}

/* ---------- mud island ---------- */
.mud{background:
  radial-gradient(ellipse 30% 10% at 30% 70%, rgba(120,190,230,.8) 60%, transparent 62%),
  radial-gradient(ellipse 18% 7% at 70% 55%, rgba(120,190,230,.8) 60%, transparent 62%),
  radial-gradient(ellipse 22% 8% at 55% 88%, rgba(120,190,230,.8) 60%, transparent 62%),
  linear-gradient(180deg,#8fe3ff 0%,#c9f3ff 18%,#23b0e0 18%,#23b0e0 26%,#b88a5a 26%,#a0754a 100%);}
.hid{position:absolute; border:0; background:none; font-size:clamp(30px,4.6vw,46px); padding:6px; cursor:pointer; transform:translate(-50%,-50%); opacity:.82; line-height:1;}
.hid.found{opacity:1; animation:pop .5s; filter:drop-shadow(0 0 8px #fff);}
.hid.found:after{content:"✔"; position:absolute; right:-6px; top:-8px; font-size:20px; background:var(--leaf); color:#fff; border-radius:50%; width:26px; height:26px; display:flex; align-items:center; justify-content:center;}
.tray{position:absolute; left:50%; bottom:12px; transform:translateX(-50%); display:flex; gap:6px; background:rgba(255,255,255,.95); border:4px solid var(--ink); border-radius:22px; padding:6px 10px; z-index:5;}
.tray span{font-size:clamp(24px,3.6vw,36px); filter:grayscale(1) opacity(.35); transition:.3s;}
.tray span.got{filter:none;}
.mangrove{position:absolute; font-size:clamp(60px,10vw,110px); line-height:1;}

/* ---------- treasure ---------- */
.parch{background:radial-gradient(circle at 50% 50%,#fff3c9,#f4d78c 70%,#d9b35e);}
.tmap{position:absolute; inset:14px; border:6px dashed #8b5a2b; border-radius:30px;}
.spot{position:absolute; transform:translate(-50%,-50%); border:0; background:none; display:flex; flex-direction:column; align-items:center; cursor:pointer; padding:0;}
.spot .ic{font-size:clamp(44px,7vw,74px); line-height:1; filter:drop-shadow(0 4px 0 rgba(0,0,0,.2));}
.spot .nm{background:#8b5a2b; color:#fff; border-radius:10px; padding:2px 10px; font-weight:600; font-size:clamp(13px,1.7vw,17px);}
.spot.done .ic:after{content:"✔"; font-size:.4em; color:var(--leaf2);}
.riddle{position:absolute; left:50%; top:24px; transform:translateX(-50%); width:min(640px,90%); background:#fffdf2; border:4px solid #8b5a2b; border-radius:22px; padding:12px 18px; font-size:clamp(17px,2.3vw,23px); text-align:center; z-index:4; box-shadow:0 6px 0 rgba(0,0,0,.15);}
.codebox{position:absolute; right:24px; bottom:24px; display:flex; gap:8px; background:#fffdf2; border:4px solid #8b5a2b; border-radius:18px; padding:8px 12px; align-items:center; font-weight:700; z-index:4;}
.codebox .d{width:44px; height:54px; border:3px solid var(--ink); border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:30px; background:#fff;}
.dials{display:flex; gap:12px; justify-content:center; margin:14px 0;}
.dial{display:flex; flex-direction:column; align-items:center; gap:6px;}
.dial .v{width:70px; height:84px; background:#fff; border:4px solid var(--ink); border-radius:14px; font-size:52px; font-weight:700; display:flex; align-items:center; justify-content:center;}
.dial button{width:70px; height:50px; font-size:26px; border-radius:14px; border:3px solid var(--ink); background:var(--sun); cursor:pointer;}
.chest-lid{transform-origin:20px 60px; transition:transform .8s cubic-bezier(.3,1.6,.5,1);}
.chest.open .chest-lid{transform:rotate(-38deg);}
.confetti{position:absolute; top:-20px; width:12px; height:18px; border-radius:3px; z-index:40; animation:fall linear forwards; pointer-events:none;}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);}}
.cert{width:min(760px,100%); max-height:100%; overflow:auto; text-align:center; background:#fffdf2; border:8px double var(--orange);}
.cert h1{margin:4px 0; font-size:clamp(28px,4.4vw,46px); color:var(--sea2);}
.cert .names{font-size:clamp(30px,5vw,54px); font-weight:700; color:var(--coral); margin:6px 0;}
.stamps{display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin:12px 0;}
.stamps span{width:64px; height:64px; border-radius:50%; border:4px dashed var(--coral); display:flex; align-items:center; justify-content:center; font-size:32px; transform:rotate(-8deg); background:#fff;}
.names-form{display:flex; flex-direction:column; gap:12px; width:min(820px,100%); max-height:100%; overflow:auto;}
.chips{display:flex; flex-wrap:wrap; gap:10px; justify-content:center;}
.kidface{width:100%; aspect-ratio:1; border-radius:50%; border:5px solid var(--ink); background:#fff; display:block; box-shadow:0 6px 0 rgba(0,0,0,.2); object-fit:cover;}
.noface{display:flex; align-items:center; justify-content:center; font-size:60px;}
.chipface{width:clamp(64px,9vw,92px); height:clamp(64px,9vw,92px); border-radius:50%; border:3px solid var(--ink); display:block; margin:0 auto 6px; object-fit:cover; background:#fff;}
.chip{display:flex; flex-direction:column; align-items:center;}
.crewrow{display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin:8px 0;}
.crewrow img, .crewrow .noface{width:64px; height:64px; border-radius:50%; border:3px solid var(--ink); font-size:32px;}
.chip{font-size:clamp(18px,2.3vw,24px); font-weight:700; padding:10px 14px; border-radius:20px; border:4px solid var(--ink); background:#fff; opacity:.55; cursor:pointer;}
.chip.on{background:var(--sun); opacity:1; box-shadow:0 5px 0 #d9a300;}
.chip.on span:before{content:"✔ ";}
.names-form input{font-size:26px; padding:14px 18px; border-radius:18px; border:4px solid var(--ink); outline:none; width:100%;}
.names-form input:focus{border-color:var(--sea2); box-shadow:0 0 0 4px #bfeeff;}
.muted{opacity:.7; font-size:.8em;}
</style>
</head>
<body>
<div id="app">
  <div id="bar">
    <button class="ibtn" id="homeBtn" aria-label="Journey map">🗺️</button>
    <div class="ttl" id="title">Balistidae Quest</div>
    <div id="shells">🐚 0</div>
    <button class="ibtn" id="fsBtn" aria-label="Full screen">⛶</button>
    <button class="ibtn" id="talkBtn" aria-label="Read aloud">🗣️</button>
    <button class="ibtn" id="sndBtn" aria-label="Sound">🔊</button>
  </div>
  <div id="stage"></div>
</div>

<script>
/* =========================================================
   BALISTIDAE QUEST — a Mozambique holiday adventure game
   Everything is in this one file so it works offline on iPad.
   Photos (optional) live in /assets — see PHOTOS below.
   ========================================================= */

// ---------- editable family details ----------
const FAMILY = {
  kids: ['Kayden', 'Oliver', 'Blake', 'Tayla', 'Gabbie'],
  grownups: ['Lee', 'Rylie', 'Kerry', 'Wade'],
  kidPics: { Kayden: 'assets/kid-kayden.png', Oliver: 'assets/kid-oliver.png', Blake: 'assets/kid-blake.png', Tayla: 'assets/kid-tayla.png', Gabbie: 'assets/kid-gabbie.png' },
  dad: 'Lee',
  hotel: 'Sun International hotel',
  skipper: 'Marcos',
  chef: 'Jabulani',
  boatName: 'Titan',
};
// Optional holiday pictures shown as "polaroids" in the story.
// If a file is missing it is simply skipped.
const PHOTOS = {
  logo: 'assets/logo.png',
  lodge: 'assets/lodge.jpg',
  beach: 'assets/beach.jpg',
  boat: 'assets/boat.jpg',
  fishing: 'assets/fishing.jpg',
  bay: 'assets/bay.jpg',
  peninsula: 'assets/peninsula.jpg',
  deck: 'assets/deck.jpg',
  turtles: 'assets/turtles.jpg',
  oliverFishing: 'assets/oliver-fishing.jpg',
  oliverTuna: 'assets/oliver-tuna.jpg',
  dhow: 'assets/dhow.jpg',
  boatRide: 'assets/boat-ride.jpg',
  girlsBoat: 'assets/girls-boat.jpg',
  driftwood: 'assets/driftwood-fish.jpg',
  crew: 'assets/crew-maputo.jpg',
};

// ---------- tiny helpers ----------
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const stage = $('#stage');
const h = html => { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; };
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const PRAISE = ['Brilliant! 🎉', 'Spot on! ⭐', 'Legend! 🏆', 'Super smart! 🧠', 'Yes! Nailed it! 🙌', 'Awesome! 🌟', 'Correct! 🐠'];

// ---------- save state ----------
const SAVE_KEY = 'balistidae-quest-v1';
let S = { names: [], shells: 0, done: [] };
try { const s = JSON.parse(localStorage.getItem(SAVE_KEY)); if (s && Array.isArray(s.done)) S = s; } catch (e) {}
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {} }

const list = n => n.length < 2 ? (n[0] || 'Explorers') : n.slice(0, -1).join(', ') + ' & ' + n[n.length - 1];
function kids() { return list(S.names.filter(Boolean)); }
function fill(t) { return String(t).replace(/\{kids\}/g, kids())
  .replace(/\{allkids\}/g, list(FAMILY.kids)).replace(/\{grownups\}/g, list(FAMILY.grownups))
  .replace(/\{p(\d)\}/g, (m, i) => FAMILY.grownups[i] || '').replace(/\{dad\}/g, FAMILY.dad).replace(/\{hotel\}/g, FAMILY.hotel)
  .replace(/\{skipper\}/g, FAMILY.skipper).replace(/\{chef\}/g, FAMILY.chef).replace(/\{boat\}/g, FAMILY.boatName); }

// ---------- sound ----------
const sfx = (() => {
  let ctx, on = true;
  function c() {
    if (!ctx) { try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
    if (ctx && ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  function tone(f, d = .12, type = 'sine', v = .15, when = 0, slide) {
    if (!on) return; const a = c(); if (!a) return;
    const o = a.createOscillator(), g = a.createGain(), t0 = a.currentTime + when;
    o.type = type; o.frequency.setValueAtTime(f, t0);
    if (slide) o.frequency.exponentialRampToValueAtTime(slide, t0 + d);
    g.gain.setValueAtTime(v, t0); g.gain.exponentialRampToValueAtTime(.001, t0 + d);
    o.connect(g).connect(a.destination); o.start(t0); o.stop(t0 + d + .05);
  }
  return {
    unlock: c,
    click: () => tone(700, .06, 'triangle', .08),
    good: () => { tone(523, .12, 'triangle'); tone(659, .12, 'triangle', .15, .1); tone(784, .22, 'triangle', .15, .2); },
    bad: () => { tone(260, .18, 'sawtooth', .06, 0, 180); },
    shell: () => { tone(1200, .08, 'sine', .1); tone(1600, .1, 'sine', .08, .07); },
    splash: () => { tone(400, .3, 'sine', .1, 0, 90); },
    snap: () => { tone(1800, .05, 'square', .12); tone(90, .35, 'sawtooth', .1, .04, 40); },
    reel: () => tone(rand(300, 380), .04, 'square', .025),
    fanfare: () => [523, 659, 784, 1047, 784, 1047].forEach((f, i) => tone(f, .22, 'square', .06, i * .14)),
    toggle() { on = !on; return on; },
    get on() { return on; },
  };
})();

// ---------- read-aloud ----------
let narrate = false;
function speak(text) {
  if (!narrate || !window.speechSynthesis) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(fill(text).replace(/<[^>]+>/g, ' ').replace(/[\u{1F300}-\u{1FAFF}☀-➿]/gu, ''));
    u.rate = .95; u.pitch = 1.1; u.lang = 'en-GB';
    speechSynthesis.speak(u);
  } catch (e) {}
}

// ---------- scene system ----------
let sceneId = 0;
function scene(fn) {
  sceneId++;
  stage.innerHTML = '';
  try { window.speechSynthesis && speechSynthesis.cancel(); } catch (e) {}
  fn(sceneId);
}
function later(fn, ms) { const id = sceneId; setTimeout(() => { if (id === sceneId) fn(); }, ms); }
function loop(step) {
  const id = sceneId; let last = performance.now();
  function f(t) {
    if (id !== sceneId) return;
    const dt = Math.min(60, t - last) / 1000; last = t;
    if (step(dt, t) !== false) requestAnimationFrame(f);
  }
  requestAnimationFrame(f);
}
function setTitle(t) { $('#title').textContent = t; }
function toast(html, ms = 2600) {
  $$('.toast', stage).forEach(t => t.remove());
  const t = h(`<div class="toast">${html}</div>`); stage.appendChild(t);
  const id = sceneId; setTimeout(() => t.remove(), ms);
}
function addShells(n) {
  S.shells += n; save(); sfx.shell();
  const el = $('#shells'); el.textContent = '🐚 ' + S.shells;
  el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop');
}
function face(name, cls = 'kidface') {
  const src = FAMILY.kidPics[name];
  return src ? `<img class="${cls}" src="${src}" alt="${name}" onerror="this.replaceWith(document.createTextNode('🧒'))">` : `<div class="${cls} noface">🧒</div>`;
}
function photo(key) { return PHOTOS[key] ? `<img class="photo" src="${PHOTOS[key]}" alt="" onerror="this.remove()">` : ''; }

// ---------- cartoon art (SVG) ----------
const ART = {
  trig: () => `<svg viewBox="0 0 170 130" aria-label="Trig the triggerfish">
    <path d="M40 66 L8 38 Q4 66 8 94 Z" fill="#ffd21f" stroke="#16324f" stroke-width="4" stroke-linejoin="round"/>
    <path d="M72 30 L80 4 L96 26 Z" fill="#ffd21f" stroke="#16324f" stroke-width="4" stroke-linejoin="round"/>
    <path d="M36 66 Q48 22 100 22 Q150 24 158 66 Q150 108 100 110 Q48 110 36 66 Z" fill="#2fa8ff" stroke="#16324f" stroke-width="4"/>
    <path d="M60 36 Q70 66 60 98" stroke="#ffd21f" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M80 28 Q92 66 80 106" stroke="#ff8fc7" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M70 102 Q100 128 128 104" fill="#ffd21f" stroke="#16324f" stroke-width="4"/>
    <circle cx="124" cy="52" r="17" fill="#fff" stroke="#16324f" stroke-width="4"/>
    <circle cx="128" cy="54" r="8" fill="#16324f"/><circle cx="131" cy="50" r="3" fill="#fff"/>
    <path d="M142 80 Q152 84 158 78" stroke="#16324f" stroke-width="4" fill="#ff6b6b" stroke-linecap="round"/>
    <path d="M104 70 Q116 62 118 78 Q110 84 104 70Z" fill="#ffd21f" stroke="#16324f" stroke-width="3"/>
  </svg>`,
  lee: () => `<svg viewBox="0 0 140 140" aria-label="${FAMILY.dad}">
    <circle cx="70" cy="80" r="46" fill="#ffcf9e" stroke="#16324f" stroke-width="4"/>
    <path d="M20 58 Q70 8 120 58 Z" fill="#2ec46d" stroke="#16324f" stroke-width="4" stroke-linejoin="round"/>
    <rect x="10" y="54" width="120" height="12" rx="6" fill="#1a9b52" stroke="#16324f" stroke-width="4"/>
    <rect x="36" y="70" width="28" height="18" rx="7" fill="#16324f"/><rect x="76" y="70" width="28" height="18" rx="7" fill="#16324f"/>
    <path d="M64 78 H76" stroke="#16324f" stroke-width="4"/>
    <path d="M50 104 Q70 120 90 104" stroke="#16324f" stroke-width="5" fill="none" stroke-linecap="round"/>
    <circle cx="30" cy="92" r="6" fill="#ff9b9b" opacity=".6"/><circle cx="110" cy="92" r="6" fill="#ff9b9b" opacity=".6"/>
  </svg>`,
  tuna: () => `<svg viewBox="0 0 260 120" aria-label="Yellowfin tuna">
    <path d="M40 60 L4 22 Q14 60 4 98 Z" fill="#1e4f8f" stroke="#16324f" stroke-width="4" stroke-linejoin="round"/>
    <path d="M110 28 Q126 -6 150 26 Z" fill="#ffd21f" stroke="#16324f" stroke-width="4"/>
    <path d="M118 92 Q132 122 150 92 Z" fill="#ffd21f" stroke="#16324f" stroke-width="4"/>
    <path d="M36 60 Q80 18 170 22 Q236 28 254 60 Q236 94 170 98 Q80 102 36 60 Z" fill="#c9d8e8" stroke="#16324f" stroke-width="4"/>
    <path d="M40 58 Q80 20 170 22 Q236 28 252 58 Q170 52 40 58 Z" fill="#1e4f8f"/>
    <path d="M80 62 Q150 70 240 64" stroke="#ffd21f" stroke-width="6" fill="none" stroke-linecap="round"/>
    <g fill="#ffd21f" stroke="#16324f" stroke-width="2"><path d="M56 42 l8 -6 l2 8z"/><path d="M68 36 l8 -6 l2 8z"/><path d="M56 78 l8 6 l2 -8z"/><path d="M68 84 l8 6 l2 -8z"/></g>
    <path d="M150 64 Q170 58 172 76 Q158 80 150 64Z" fill="#ffd21f" stroke="#16324f" stroke-width="3"/>
    <circle cx="222" cy="52" r="11" fill="#fff" stroke="#16324f" stroke-width="3"/><circle cx="225" cy="53" r="5" fill="#16324f"/>
    <path d="M240 74 Q248 76 252 70" stroke="#16324f" stroke-width="3" fill="none"/>
  </svg>`,
  wahoo: () => `<svg viewBox="0 0 300 90" aria-label="Wahoo">
    <path d="M30 45 L2 18 Q12 45 2 72 Z" fill="#1c6fa8" stroke="#16324f" stroke-width="4" stroke-linejoin="round"/>
    <path d="M26 45 Q60 16 170 16 Q260 18 296 42 Q260 72 170 74 Q60 74 26 45 Z" fill="#8fd3ff" stroke="#16324f" stroke-width="4"/>
    <path d="M30 44 Q60 18 170 18 Q258 20 294 42 Q170 38 30 44Z" fill="#1c6fa8"/>
    <g stroke="#1c6fa8" stroke-width="6" stroke-linecap="round"><path d="M80 30 V60"/><path d="M110 28 V64"/><path d="M140 26 V66"/><path d="M170 26 V66"/><path d="M200 28 V62"/></g>
    <path d="M110 18 Q160 0 220 20" fill="#1c6fa8" stroke="#16324f" stroke-width="3"/>
    <circle cx="262" cy="38" r="8" fill="#fff" stroke="#16324f" stroke-width="3"/><circle cx="264" cy="39" r="4" fill="#16324f"/>
    <path d="M276 52 L296 44" stroke="#16324f" stroke-width="3"/>
  </svg>`,
  boat: () => `<svg viewBox="0 0 260 150" aria-label="Fishing boat">
    <path d="M150 40 L150 6 L250 -8" stroke="#16324f" stroke-width="5" fill="none" stroke-linecap="round"/>
    <rect x="70" y="36" width="80" height="44" rx="8" fill="#fff" stroke="#16324f" stroke-width="4"/>
    <rect x="82" y="46" width="24" height="18" rx="4" fill="#8ee6ff" stroke="#16324f" stroke-width="3"/><rect x="114" y="46" width="24" height="18" rx="4" fill="#8ee6ff" stroke="#16324f" stroke-width="3"/>
    <path d="M10 80 H250 L220 130 H40 Z" fill="#ff6b6b" stroke="#16324f" stroke-width="5" stroke-linejoin="round"/>
    <path d="M24 100 H236" stroke="#fff" stroke-width="7"/>
    <text x="130" y="124" text-anchor="middle" font-size="16" font-weight="700" fill="#fff" font-family="Fredoka, sans-serif">${FAMILY.boatName.toUpperCase()}</text>
  </svg>`,
  chest: () => `<svg viewBox="0 0 200 170" class="chest" aria-label="Treasure chest">
    <rect x="20" y="70" width="160" height="90" rx="10" fill="#b8742f" stroke="#16324f" stroke-width="5"/>
    <rect x="20" y="96" width="160" height="12" fill="#ffd21f" stroke="#16324f" stroke-width="3"/>
    <rect x="86" y="88" width="28" height="34" rx="6" fill="#ffd21f" stroke="#16324f" stroke-width="4"/><circle cx="100" cy="102" r="5" fill="#16324f"/>
    <g class="treasure"><circle cx="70" cy="72" r="12" fill="#ffd21f" stroke="#e0a800" stroke-width="3"/><circle cx="96" cy="66" r="12" fill="#ffd21f" stroke="#e0a800" stroke-width="3"/><circle cx="124" cy="72" r="12" fill="#ffd21f" stroke="#e0a800" stroke-width="3"/><path d="M140 60 l8 -10 l8 10 l-8 10z" fill="#ff8fc7" stroke="#16324f" stroke-width="2"/></g>
    <g class="chest-lid"><path d="M20 70 Q20 22 100 22 Q180 22 180 70 Z" fill="#cf8a3e" stroke="#16324f" stroke-width="5"/><path d="M92 22 V70 M108 22 V70" stroke="#ffd21f" stroke-width="8"/></g>
  </svg>`,
};

// ---------- dialogue ----------
// lines: strings (Trig speaks) or {who:'trig'|'lee', text, img}
function story(lines, done, lastLabel) {
  let i = 0;
  const ov = h(`<div class="overlay"><div class="talk"><div class="talker"></div><div class="bubble"><div class="who"></div><div class="img"></div><div class="txt"></div><div class="actions"><button class="btn next">Next ▶</button></div></div></div></div>`);
  stage.appendChild(ov);
  const show = () => {
    const l = typeof lines[i] === 'string' ? { text: lines[i] } : lines[i];
    const who = l.who || 'trig';
    $('.talker', ov).innerHTML = ART[who] ? ART[who]() : face(who);
    $('.who', ov).textContent = who === 'trig' ? 'Trig the Triggerfish' : who === 'lee' ? FAMILY.dad : who;
    $('.img', ov).innerHTML = l.img ? photo(l.img) : '';
    $('.txt', ov).innerHTML = fill(l.text);
    const b = $('.bubble', ov); b.style.animation = 'none'; void b.offsetWidth; b.style.animation = '';
    $('.next', ov).textContent = i === lines.length - 1 ? (lastLabel || "Let's go! ▶") : 'Next ▶';
    speak(l.text);
  };
  $('.next', ov).onclick = () => { sfx.click(); i++; if (i >= lines.length) { ov.remove(); done && done(); } else show(); };
  show();
}

// ---------- questions ----------
// q: {q, answer, options?, hint, fact, unit, art, tag}
function ask(q, done) {
  let tries = 0, val = '', dv = null;
  const ov = h(`<div class="overlay"><div class="panel quiz pop-in">
      ${q.art ? `<div class="qart">${q.art}</div>` : ''}
      <div class="qtag">${q.tag || '🧠 Brain Challenge'}</div>
      <div class="qtext">${fill(q.q)}</div>
      <div class="qhint"></div><div class="qbody"></div></div></div>`);
  const panel = $('.panel', ov), body = $('.qbody', ov), hint = $('.qhint', ov);
  if (q.options) {
    body.className = 'qbody opts';
    if (q.options.length > 3) body.style.gridTemplateColumns = '1fr 1fr';
    shuffle(q.options).forEach(o => { const b = h(`<button class="btn opt">${o}</button>`); b.onclick = () => check(o, b); body.appendChild(b); });
  } else {
    body.innerHTML = `<div class="display"><span class="dv">&nbsp;</span>${q.unit ? `<span class="unit">${q.unit}</span>` : ''}</div>
      <div class="pad">${[1, 2, 3, 4, 5, 6, 7, 8, 9, '⌫', 0, '✓'].map(k => `<button class="key ${k === '✓' ? 'ok' : ''}" data-k="${k}">${k}</button>`).join('')}</div>`;
    dv = $('.dv', body);
    $$('.key', body).forEach(b => b.onclick = () => {
      const k = b.dataset.k; sfx.click();
      if (k === '⌫') val = val.slice(0, -1);
      else if (k === '✓') { if (val) check(val); return; }
      else if (val.length < 6) val += k;
      dv.innerHTML = val || '&nbsp;';
    });
  }
  stage.appendChild(ov); speak(q.q);
  function check(v, btn) {
    if (String(v) === String(q.answer)) {
      const pts = tries === 0 ? 10 : tries === 1 ? 6 : 3;
      if (btn) btn.classList.add('right');
      sfx.good();
      setTimeout(() => {
        addShells(pts);
        panel.innerHTML = `<div class="yay">${pick(PRAISE)}</div><div class="pts">+${pts} 🐚</div>
          ${q.fact ? `<div class="fact">💡 ${fill(q.fact)}</div>` : ''}<button class="btn green go">Continue ▶</button>`;
        panel.classList.remove('pop-in'); void panel.offsetWidth; panel.classList.add('pop-in');
        if (q.fact) speak(q.fact);
        $('.go', panel).onclick = () => { sfx.click(); ov.remove(); done && done(); };
      }, btn ? 450 : 0);
    } else {
      tries++; sfx.bad();
      panel.classList.remove('shake', 'pop-in'); void panel.offsetWidth; panel.classList.add('shake');
      if (btn) { btn.classList.add('wrong'); btn.disabled = true; }
      hint.innerHTML = '🤔 ' + fill(tries > 1 && q.hint2 ? q.hint2 : (q.hint || 'Not quite — have another go!'));
      val = ''; if (dv) dv.innerHTML = '&nbsp;';
    }
  }
}
function askAll(qs, done) { let i = 0; const next = () => i < qs.length ? ask(qs[i++], next) : done && done(); next(); }

// ---------- chapters & journey map ----------
const CHAPTERS = [
  { title: 'The Great Road Trip', icon: '🚗', x: 12, y: 74, run: chRoad },
  { title: 'A Night in Maputo', icon: '🏨', x: 30, y: 38, run: chHotel },
  { title: 'Boat to Balistidae', icon: '🚤', x: 47, y: 70, run: chBoat },
  { title: "Hell's Gate Fishing", icon: '🎣', x: 62, y: 32, run: chFish },
  { title: 'Mud Island', icon: '🦀', x: 76, y: 70, run: chMud },
  { title: 'The Treasure Hunt', icon: '💰', x: 89, y: 34, run: chTreasure },
];
const unlocked = i => i === 0 || !!S.done[i - 1];

function finishChapter(i, stampText) {
  S.done[i] = true; save();
  sfx.fanfare();
  const ov = h(`<div class="overlay"><div class="center" style="gap:26px">
      <div class="stamp"><div class="ic">${CHAPTERS[i].icon}</div><div class="t">${stampText || CHAPTERS[i].title}</div><div style="font-weight:600;margin-top:6px">PASSPORT STAMP</div></div>
      <button class="btn green">${i < CHAPTERS.length - 1 ? 'Back to the Journey Map ▶' : 'See your certificate 🏆'}</button></div></div>`);
  stage.appendChild(ov); confetti(60);
  speak(`Chapter complete! You earned the ${CHAPTERS[i].title} passport stamp!`);
  $('.btn', ov).onclick = () => { sfx.click(); i < CHAPTERS.length - 1 ? journey() : certificate(); };
}

function journey() {
  scene(() => {
    setTitle('🗺️ Your Mozambique Journey');
    const el = h(`<div class="full journey"><div class="waves" style="top:0"></div></div>`);
    const pts = CHAPTERS.map(c => `${c.x * 10},${c.y * 7}`).join(' ');
    el.appendChild(h(`<svg class="full" viewBox="0 0 1000 700" preserveAspectRatio="none" style="width:100%;height:100%">
      <polyline points="${pts}" fill="none" stroke="#fff" stroke-width="10" stroke-dasharray="4 22" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>`));
    // decoration
    [['🌴', 4, 10], ['🐬', 44, 12], ['⛵', 72, 88], ['🐢', 22, 92], ['🐠', 94, 80], ['☀️', 88, 6]].forEach(([e, x, y]) =>
      el.appendChild(h(`<div class="bob" style="position:absolute;left:${x}%;top:${y}%;font-size:clamp(30px,5vw,56px)">${e}</div>`)));
    const nextIdx = CHAPTERS.findIndex((c, i) => !S.done[i]);
    CHAPTERS.forEach((c, i) => {
      const st = S.done[i] ? 'done' : unlocked(i) ? 'next' : 'locked';
      const b = h(`<button class="jnode ${st}" style="left:${c.x}%;top:${c.y}%"><div class="disc">${unlocked(i) ? c.icon : '🔒'}<div class="num">${i + 1}</div>${S.done[i] ? '<div class="tick">✔</div>' : ''}</div><div class="lbl">${c.title}</div></button>`);
      b.onclick = () => {
        sfx.click();
        if (!unlocked(i)) { toast(`🔒 Finish chapter ${i} first!`); sfx.bad(); return; }
        c.run();
      };
      el.appendChild(b);
    });
    const allDone = S.done.filter(Boolean).length === CHAPTERS.length;
    const foot = h(`<div style="position:absolute;left:14px;bottom:14px;display:flex;gap:10px;flex-wrap:wrap">

/* =========================================================
   QUESTION BANK
   Every challenge picks from a pool (at least 5 per slot), and
   the maths ones also roll new numbers, so no two games match.
   Recently asked questions are skipped until the pool runs out.
   ========================================================= */
const ri = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const num = n => n.toLocaleString('en-GB');
const clock = mins => { const h = Math.floor(mins / 60) % 12 || 12, m = mins % 60; return `${h}:${String(m).padStart(2, '0')}`; };
// numeric multiple-choice: right answer plus distinct nearby wrong ones
const near = (ans, deltas) => { const o = [ans]; for (const d of shuffle(deltas)) { const v = ans + d; if (v > 0 && !o.includes(v) && o.length < 3) o.push(v); } return o; };

function pickQ(key) {
  const pool = QB[key];
  S.qh = S.qh || {};
  let seen = (S.qh[key] || []).filter(i => i < pool.length);
  if (seen.length >= pool.length) seen = seen.slice(-1);
  const i = pick(pool.map((_, j) => j).filter(j => !seen.includes(j)));
  S.qh[key] = seen.concat(i); save();
  return typeof pool[i] === 'function' ? pool[i]() : pool[i];
}

// safe code: random 3 digits, each with a random clue
function digitClue(d) {
  return pick([
    () => { const k = ri(2, 9); return `<b>${d + k} − ${k}</b>`; },
    () => { const k = ri(2, 5); return `<b>${d * k} ÷ ${k}</b>`; },
    () => { const a = ri(0, d); return `<b>${a} + ${d - a}</b>`; },
    () => d % 2 === 0 ? `<b>half of ${d * 2}</b>` : `<b>${d * 3} ÷ 3</b>`,
    () => `the number of legs a crab has (10), take away <b>${10 - d}</b>`,
    () => `an octopus has 8 arms… ${d >= 8 ? `add <b>${d - 8}</b>` : `take away <b>${8 - d}</b>`}`,
  ])();
}
function safeQ() {

// boat buoys: random sums each time
function buoyStep(last) {
  const t = pick(['mul', 'div', 'half', 'pct', 'add', 'sq', 'sub']);
  let c, a;
  if (t === 'mul') { const x = ri(3, 12), y = ri(3, 12); c = `${x} × ${y}`; a = x * y; }
  if (t === 'div') { const y = ri(3, 9); a = ri(3, 12); c = `${a * y} ÷ ${y}`; }
  if (t === 'half') { const n = ri(15, 60) * 2; c = `half of ${n}`; a = n / 2; }
  if (t === 'pct') { const [b, p] = pick([[40, 25], [80, 25], [120, 25], [200, 25], [300, 10], [400, 10], [90, 50], [150, 50]]); c = `${p}% of ${b}`; a = b * p / 100; }
  if (t === 'add') { const x = ri(25, 75), y = ri(15, 45); c = `${x} + ${y}`; a = x + y; }
  if (t === 'sq') { const x = ri(2, 6), y = ri(2, 6); c = `${x}×${x} + ${y}×${y}`; a = x * x + y * y; }
  if (t === 'sub') { const x = ri(60, 150), y = ri(15, 45); c = `${x} − ${y}`; a = x - y; }
  return { c: `${last ? 'Last one! ' : ''}Sail to the buoy showing <b>${c}</b>`, a, d: near(a, [-1, 1, -10, 10, 2, -2]).slice(1) };
}

    () => { const k = ri(1, 5); return { q: `There were <b>${d + k}</b> kayaks on the beach. <b>${k}</b> went out paddling. How many are left?`, hint: `${d + k} − ${k} = ?` }; },

    setTitle('🦀 Chapter 5: Mud Island');
    const CREATURES = [
      { e: '🦀', f: 'Fiddler crab! 🦀 Boys have one GIANT claw that they wave to show off.' },
      { e: '🦩', f: 'Flamingo! 🦩 They are pink because of the tiny shrimp and algae they eat.' },
      { e: '🐚', f: 'Cowrie shell! 🐚 Long ago cowrie shells were used as money in parts of Africa.' },
      { e: '⭐', f: 'Sea star! ⭐ A starfish can grow back a lost arm!' },
      { e: '🐢', f: 'Sea turtle! 🐢 Loggerhead and leatherback turtles lay eggs on the Santa Maria beaches. You might even see hatchlings!' },
      { e: '🦐', f: 'Prawn! 🦐 Maputo Bay is a nursery where millions of baby prawns grow up.' },
      { e: '🐙', f: 'Octopus! 🐙 It has THREE hearts and blue blood!' },
      { e: '🐟', f: 'Mudskipper! 🐟 A fish that walks on mud using its fins, and breathes through its skin!' },
      { e: '🐡', f: 'Pufferfish! 🐡 It gulps water to blow itself up like a spiky balloon.' },
      { e: '🦑', f: 'Squid! 🦑 It squirts a cloud of ink to escape from danger.' },
      { e: '🪼', f: 'Jellyfish! 🪼 It has no brain, no heart and no bones!' },
      { e: '🦞', f: 'Crayfish! 🦞 Chef Jabulani cooks these fresh for dinner at Balistidae.' },
      { e: '🐬', f: 'Dolphin! 🐬 Dolphins visit Maputo Bay and sometimes swim right up to boats.' },
    ];
    const ITEMS = shuffle(CREATURES).slice(0, 8);
    shuffle([[18, 58], [84, 40], [46, 78], [64, 86], [92, 74], [34, 42], [72, 62], [8, 86], [52, 48], [24, 74], [88, 58], [60, 38], [40, 62], [12, 44]])
      .slice(0, 8).forEach(([x, y], i) => { ITEMS[i] = { ...ITEMS[i], x, y }; });
    const el = h(`<div class="full mud">
      <div class="mangrove" style="left:1%;top:14%">🌳</div><div class="mangrove" style="left:12%;top:18%">🌿</div><div class="mangrove" style="right:2%;top:12%">🌳</div>
      <div style="position:absolute;right:30%;top:4%;font-size:40px" class="bob">🚤</div>
      <div class="tray"></div></div>`);
    stage.appendChild(el);
    const tray = $('.tray', el);
    let found = 0;
    ITEMS.forEach((it, k) => {
      const t = h(`<span>${it.e}</span>`); tray.appendChild(t);
      const b = h(`<button class="hid" style="left:${it.x}%;top:${it.y}%;transform:translate(-50%,-50%) rotate(${rand(-25, 25)}deg) scale(${rand(.75, 1)})">${it.e}</button>`);
      b.onclick = () => {
        if (b.classList.contains('found')) return;
        b.classList.add('found'); t.classList.add('got'); found++;
        sfx.good(); addShells(3); toast(it.f, 3200); speak(it.f);
        if (found === ITEMS.length) later(() => story([`You found ALL the Mud Island creatures! 🎉 You're a real marine biologist!`, `But wait… the <b class="hl">tide</b> is coming back in! 🌊`], () =>
          ask({ ...pickQ('tide'), fact: pick(TIDE_FACTS) },
            () => finishChapter(4, 'Mud Island Ranger')), 'Uh oh! ⏰'), 1800);
      };
      el.appendChild(b);
    });
    const hb = h(`<button class="btn small blue" style="position:absolute;right:12px;bottom:14px;z-index:6">💡 Hint</button>`);
    hb.onclick = () => { const n = $$('.hid:not(.found)', el)[0]; if (n) { n.classList.add('pulse'); later(() => n.classList.remove('pulse'), 2500); } };
    el.appendChild(hb);
    story([
      { img: 'dhow', text: `On the way you pass a traditional <b class="hl">dhow</b>, a wooden sailing boat, anchored near the sandbanks. ⛵` },
      { img: 'bay', text: `The boat drops you on <b class="hl">Mud Island</b> in the middle of the bay! It only pops up at low tide. 🏝️` },
      { img: 'peninsula', text: `From up high the bay looks like a painting — sandbanks, channels and shallow turquoise water everywhere! 🎨` },
      { who: 'Blake', text: `I bet I find more crabs than anyone! 🦀` },
      `The mud and shallow pools are full of amazing creatures. Can you find all <b class="hl">8</b>? Check the tray at the bottom!`,
    ], null, 'Start searching! 🔍');
  });
}

/* =========================================================
   CHAPTER 6 — THE BALISTIDAE TREASURE HUNT
   ========================================================= */
function chTreasure() {
  scene(() => {
    setTitle('💰 Chapter 6: The Treasure Hunt');
    const SPOTS = {
      pool: { ic: '🏊', nm: 'Pool', x: 30, y: 44 },
      kayak: { ic: '🛶', nm: 'Kayaks', x: 82, y: 70 },
      palm: { ic: '🌴', nm: 'Palm Tree', x: 58, y: 36 },
      fire: { ic: '🔥', nm: 'Fire Pit', x: 44, y: 70 },
      lodge: { ic: '🏡', nm: 'Lodge', x: 14, y: 72 },
      deck: { ic: '🌅', nm: 'Sundowner Deck', x: 76, y: 30 },
      hammock: { ic: '🪢', nm: 'Hammock', x: 62, y: 84 },
      umbrella: { ic: '⛱️', nm: 'Beach', x: 90, y: 50 },
    };
    const kinds = shuffle([0, 1, 2, 3, 4, 5, 6, 7]);
    const CLUES = shuffle(Object.keys(SPOTS)).slice(0, 4).map((spot, i) => {
      const d = ri(1, 9);
      return { spot, r: fill(RIDDLES[spot]), q: { ...digitPuzzle(d, kinds[i]), answer: d } };
    });
    const CODE = CLUES.map(c => c.q.answer).join('');
    const el = h(`<div class="full parch"><div class="tmap"></div>
      <svg class="full" viewBox="0 0 100 100" preserveAspectRatio="none" style="width:100%;height:100%">
        <path d="M100,0 L100,100 L70,100 Q80,70 72,50 Q66,30 78,0Z" fill="#6fd0f2" opacity=".75"/>
        <path d="M70,100 Q80,70 72,50 Q66,30 78,0" stroke="#fff" stroke-width=".8" fill="none" stroke-dasharray="2 2"/>
      </svg>
      <div style="position:absolute;left:4%;top:6%;font-size:clamp(40px,6vw,64px);transform:rotate(-10deg)">🧭</div>
      <div class="riddle"></div>
      <div class="codebox">Code: ${CLUES.map(() => '<div class="d">?</div>').join('')}</div></div>`);
    stage.appendChild(el);
    const riddle = $('.riddle', el), digits = $$('.codebox .d', el);
    let k = 0;
    Object.entries(SPOTS).forEach(([id, s]) => {
      const b = h(`<button class="spot" style="left:${s.x}%;top:${s.y}%"><div class="ic">${s.ic}</div><div class="nm">${s.nm}</div></button>`);
      b.onclick = () => {
        if (k >= CLUES.length) return;
        const c = CLUES[k];
        if (id !== c.spot) { sfx.bad(); b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake'); toast(`🔍 Nothing hidden at the ${s.nm}… read the riddle again!`); return; }
        sfx.good(); addShells(5); b.classList.add('done');
        toast(`📜 You found a scroll at the ${s.nm}!`);
        later(() => ask({ tag: `📜 Scroll ${k + 1} of ${CLUES.length}`, ...c.q, fact: `The digit is <b>${c.q.answer}</b>! Write it down… it's part of the treasure chest code!` }, () => {
          digits[k].textContent = c.q.answer; digits[k].style.background = '#d9ffe7';
          k++;
          if (k < CLUES.length) showRiddle();
          else later(() => story([`You have all 4 digits: <b class="hl">${CODE.split('').join(' - ')}</b>! 🔢`, `Quick — to the treasure chest! 💰`], chest, 'Open the chest! 🗝️'), 400);
        }), 700);
      };
      el.appendChild(b);
    });
    const showRiddle = () => { riddle.innerHTML = `<b>📜 Riddle ${k + 1}:</b> ${CLUES[k].r}`; speak(CLUES[k].r); };

    const chest = () => {
      const vals = [0, 0, 0, 0];
      const ov = h(`<div class="overlay"><div class="panel center pop-in" style="width:min(620px,100%);gap:6px">
        <div style="width:min(240px,50vw)" class="chestwrap">${ART.chest()}</div>
        <div style="font-size:clamp(20px,2.6vw,26px);font-weight:600">Turn the dials to the secret code!</div>
        <div class="dials">${vals.map((v, i) => `<div class="dial"><button data-i="${i}" data-d="1">▲</button><div class="v">0</div><button data-i="${i}" data-d="-1">▼</button></div>`).join('')}</div>
        <button class="btn green open">Open! 🗝️</button></div></div>`);
      stage.appendChild(ov);
      $$('.dial button', ov).forEach(b => b.onclick = () => {
        const i = +b.dataset.i; vals[i] = (vals[i] + +b.dataset.d + 10) % 10; sfx.click();
        $$('.dial .v', ov)[i].textContent = vals[i];
      });
      $('.open', ov).onclick = () => {
        const p = $('.panel', ov);
        if (vals.join('') !== CODE) { sfx.bad(); p.classList.remove('shake', 'pop-in'); void p.offsetWidth; p.classList.add('shake'); toast(`🔒 Locked! The code is on your scroll box: ${CODE.split('').join(' ')}`); return; }
        $('.chest', ov).classList.add('open'); sfx.fanfare(); confetti(120); addShells(20);
        $('.open', ov).remove(); $('.dials', ov).remove(); $('.panel > div:nth-child(2)', ov).remove();
        p.appendChild(h(`<div class="center" style="gap:12px"><div class="yay">💰 TREASURE! 💰</div>
          <div style="font-size:clamp(18px,2.4vw,24px)">Inside is the legendary <b class="hl">Golden Triggerfish Medal</b> 🏅 — for the bravest explorers of Balistidae!</div>
          <button class="btn">Collect your medal 🏅</button></div>`));
        $('.btn:last-child', p).onclick = () => { sfx.click(); ov.remove(); finishChapter(5, 'Treasure Hunters!'); };
      };
    };

    story([
      { img: 'beach', text: `Last adventure! Somewhere at <b class="hl">Balistidae</b> an old pirate hid a treasure chest. 🏴‍☠️` },
      { img: 'driftwood', text: `Even the driftwood fish on the lodge wall seem to be pointing somewhere… 🐟🐟🐟` },
      `And {grownups} have been acting VERY suspicious all week… 🕵️ I think they know something!`,
      `Solve each <b>riddle</b>, then tap the right place on the map to find a scroll. Each scroll has a maths puzzle with one digit of the chest code!`,
    ], showRiddle, 'Start the hunt! 🔍');
  });
}

// ---------- certificate ----------

  scene(() => {
    setTitle('🏆 Official Explorer Certificate');
    const rank = S.shells >= 330 ? 'Legendary Triggerfish Captains 🐟👑' : S.shells >= 250 ? 'Master Explorers of Mozambique 🧭' : 'Brave Adventurers of Balistidae ⚓';
    const el = h(`<div class="full seabg center" style="padding:16px"><div class="panel cert pop-in">
      <img src="${PHOTOS.logo}" alt="" style="max-height:80px;max-width:60%" onerror="this.remove()">
      <h1>Official Balistidae Explorers</h1>
      <div>This certificate is proudly awarded to</div>
      <img class="photo" src="${PHOTOS.crew}" alt="The holiday crew" style="max-height:26vh;margin-top:8px" onerror="this.remove()">
      <div class="crewrow">${S.names.map(n => face(n, '')).join('')}</div>
      <div class="names">${kids()}</div>
      <div style="font-size:clamp(18px,2.4vw,24px)">for completing the <b>Great Mozambique Quest</b><br>and collecting <b class="hl">${S.shells} 🐚 shells</b>!</div>
      <div style="font-size:clamp(20px,2.8vw,28px);font-weight:700;margin-top:8px;color:var(--leaf2)">Rank: ${rank}</div>
      <div class="muted" style="margin-top:6px">Holiday crew: {allkids} · {grownups}</div>
      <div class="stamps">${CHAPTERS.map((c, i) => `<span style="opacity:${S.done[i] ? 1 : .25}">${c.icon}</span>`).join('')}</div>
      <div style="width:120px;margin:0 auto">${ART.trig()}</div>
      <div class="muted">Signed: Trig the Triggerfish · Balistidae, Mozambique 🇲🇿</div>
      <div class="muted" style="margin:6px 0 12px">📸 Take a screenshot to keep it!</div>
      <div class="row"><button class="btn map">Journey map 🗺️</button><button class="btn blue again">Play again ↺</button></div>
    </div></div>`);
    el.innerHTML = fill(el.innerHTML);
    stage.appendChild(el); confetti(80); sfx.fanfare();
    $('.map', el).onclick = journey;
    $('.again', el).onclick = () => { S.shells = 0; S.done = []; save(); updateShells(); journey(); };
  });
}

// ---------- confetti ----------
function confetti(n) {
  const cols = ['#ff6b6b', '#ffd21f', '#2ec46d', '#35c3ff', '#ff8fc7', '#8e6bff', '#ff9f1c'];
  for (let i = 0; i < n; i++) {
    const c = h(`<div class="confetti" style="left:${rand(0, 100)}%;background:${pick(cols)};animation-duration:${rand(1.8, 3.6)}s;animation-delay:${rand(0, .6)}s"></div>`);
    document.body.appendChild(c); setTimeout(() => c.remove(), 4500);
  }
}

// ---------- top bar ----------
$('#homeBtn').onclick = () => { sfx.click(); S.names.length ? journey() : titleScreen(); };
$('#sndBtn').onclick = () => { const on = sfx.toggle(); $('#sndBtn').textContent = on ? '🔊' : '🔈'; $('#sndBtn').classList.toggle('off', !on); };
$('#talkBtn').onclick = () => {
  narrate = !narrate; $('#talkBtn').classList.toggle('off', !narrate);
  toast(narrate ? '🗣️ Read-aloud is ON' : '🤫 Read-aloud is OFF', 1500);
  if (narrate) { const t = $('.bubble .txt', stage) || $('.qtext', stage); if (t) speak(t.innerHTML); } else try { speechSynthesis.cancel(); } catch (e) {}
};
$('#talkBtn').classList.add('off');

// ---------- full screen ----------
const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement;
const standalone = navigator.standalone || matchMedia('(display-mode: standalone), (display-mode: fullscreen)').matches;
function goFullscreen(quiet) {
  const el = document.documentElement, req = el.requestFullscreen || el.webkitRequestFullscreen;
  if (fsEl() || standalone) return;
  try {
    const r = req && req.call(el);
    if (r && r.catch) r.catch(() => quiet || fsHelp());
    else if (!req && !quiet) fsHelp();
  } catch (e) { if (!quiet) fsHelp(); }
}
function fsHelp() { toast('📱 For full screen: open the game in Safari, tap Share ⬆️ then <b>Add to Home Screen</b>.', 5000); }
if (standalone) $('#fsBtn').hidden = true;
$('#fsBtn').onclick = () => {
  sfx.click();
  if (fsEl()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  else goFullscreen(false);
};
document.addEventListener('pointerdown', () => sfx.unlock(), { once: true });
document.addEventListener('gesturestart', e => e.preventDefault());

updateShells();
titleScreen();
</script>
